name: Build VidSave iOS

on:
  # Manuell auslösen (empfohlen) — Backend-URL direkt eingeben
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend-URL (z.B. https://mein-backend.railway.app)'
        required: false
        default: ''
      skip_tests:
        description: 'Nur IPA bauen, ohne Tests auszuführen'
        type: boolean
        default: false

  # Oder automatisch bei Push auf diesen Branch
  push:
    branches:
      - main
      - master
      - 'fix/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: iOS IPA bauen
    runs-on: macos-latest
    env:
      VIDSAVE_NATIVE_TESTS: ${{ inputs.skip_tests && '0' || '1' }}

    steps:
      # ── 1. Code holen ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js & npm-Pakete ──────────────────────────────────────────
      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm ci

      # ── 3. React-App bauen ───────────────────────────────────────────────
      #   VITE_API_BASE_URL: entweder aus dem Workflow-Input oder dem Secret
      - name: Frontend bauen
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url || secrets.VITE_API_BASE_URL }}
        run: |
          if [ "$VIDSAVE_NATIVE_TESTS" = "1" ]; then npm test; fi
          npm run build

      # ── 4. CocoaPods ─────────────────────────────────────────────────────
      - name: CocoaPods installieren
        run: sudo gem install cocoapods --no-document --quiet

      - name: Pod install
        working-directory: frontend/ios/App
        run: |
          if [ "$VIDSAVE_NATIVE_TESTS" = "1" ]; then ruby ../../scripts/add-ios-test-target.rb; fi
          pod install

      # ── 5. Capacitor synchronisieren ─────────────────────────────────────
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync ios

      - name: Native playback and Photos tests
        if: ${{ !inputs.skip_tests }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl create VidSaveTests com.apple.CoreSimulator.SimDeviceType.iPhone-16)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild build-for-testing -workspace frontend/ios/App/App.xcworkspace -scheme AppMediaTests -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath /tmp/vidsave-tests CODE_SIGNING_ALLOWED=NO -quiet
          xcrun simctl install "$DEVICE" /tmp/vidsave-tests/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl privacy "$DEVICE" grant photos-add de.vidsave.app
          xcodebuild test-without-building -workspace frontend/ios/App/App.xcworkspace -scheme AppMediaTests -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath /tmp/vidsave-tests -resultBundlePath /tmp/VidSaveTests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -quiet

      - name: Native test results
        if: ${{ always() && !inputs.skip_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: VidSave-native-tests-${{ github.run_number }}
          path: /tmp/VidSaveTests.xcresult

      # ── 6. Xcode-Build (unsigned — kein Developer Account nötig) ─────────
      #   Die IPA kann mit AltStore oder Sideloadly auf das iPhone geladen werden
      - name: IPA bauen (unsigned)
        run: |
          set -euo pipefail

          xcodebuild build \
            -workspace frontend/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/vidsave-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            -quiet

          # .app → Payload/ → .ipa
          APP=$(find /tmp/vidsave-build -name "*.app" \
                  ! -path "*/Objects-normal/*" \
                  ! -path "*-runner.app" \
                  | head -1)
          echo "Gefundene .app: $APP"

          python3 frontend/scripts/check-ios-transport.py "$APP/Info.plist"

          mkdir -p /tmp/ipa/Payload
          cp -r "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r /tmp/VidSave.ipa Payload/ -x "*.DS_Store"

          echo "IPA-Größe: $(du -sh /tmp/VidSave.ipa | cut -f1)"

      # ── 7. IPA als Artifact hochladen ─────────────────────────────────────
      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VidSave-${{ github.run_number }}
          path: /tmp/VidSave.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Build-Zusammenfassung
        if: success()
        run: |
          echo "## ✅ VidSave.ipa erfolgreich gebaut" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Auf iPhone installieren:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Artifact herunterladen** (oben rechts → *Artifacts* → *VidSave-${{ github.run_number }}*)" >> $GITHUB_STEP_SUMMARY
          echo "2. **Option A – AltStore** (kostenlos, WLAN):" >> $GITHUB_STEP_SUMMARY
          echo "   - AltStore auf iPhone + AltServer auf Mac/PC installieren" >> $GITHUB_STEP_SUMMARY
          echo "   - AltStore → \"+\" → VidSave.ipa auswählen" >> $GITHUB_STEP_SUMMARY
          echo "3. **Option B – Sideloadly** (kostenlos, USB):" >> $GITHUB_STEP_SUMMARY
          echo "   - sideloadly.io herunterladen → IPA ziehen → Install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Die IPA ist **unsigned** und kann daher nicht direkt installiert werden." >> $GITHUB_STEP_SUMMARY
          echo "> AltStore/Sideloadly signieren sie mit deiner Apple-ID (kostenlos)." >> $GITHUB_STEP_SUMMARY
